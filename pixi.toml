[workspace]
authors = ["Scott Henderson <3924836+scottyhq@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "gaia-hazlab"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
build-book = { cmd = "jupyter book build --html", description = "Build the Jupyter Book to _build/html" }
serve-book = { cmd = "jupyter book start", description = "Live-preview the book only" }
build-all = { cmd = "BASE_URL=/book jupyter book build --html ; mv _build/html website/book ; mkdir -p website/book/img ; cp -R book/img/. website/book/img/ ; mkdir -p website/book/graph ; cp book/graph/*.html website/book/graph/", description = "Build the book and assemble it into website/book (matches CI)" }
serve-all = { cmd = "python -m http.server --directory website/ 3000", description = "Serve the full assembled website/ locally on port 3000" }
# In GitHub Actions, BASE_URL is set for deployment to github pages
build-ci = { cmd = "jupyter book build --html ; mv _build/html website/book ; mkdir -p website/book/img ; cp -R book/img/. website/book/img/ ; mkdir -p website/book/graph ; cp book/graph/*.html website/book/graph/", description = "CI build: same as build-all, using GitHub Actions' BASE_URL" }
# `linkcheck` will always report 404s for links to private repos/docs (expected, not a bug):
#   - github.com/gaia-hazlab/landslide-digital-twin, fire-debrisflow-ml, gaia-nhsm-deagg (private repos)
#   - docs.google.com/document/d/1kcy5L6VTg... in book/governance/decisions.md (private doc, 401)
# Check any newly reported link against this list before treating it as a real break.
linkcheck = { cmd = "jupyter book build --check-links", description = "Check the book for broken links" }
clean = { cmd = "rm -rf _build website/book", description = "Remove build outputs" }

spellcheck = { cmd = "codespell --skip ./_build,./website/book,./_attic,./review-logs,references.bib,pixi.lock --ignore-words-list GAGE,FitH,FRO", description = "Spellcheck the repo, skipping build outputs and references" }
spellcheck-context = { cmd = "codespell --skip ./_build,./website/book,./_attic,./review-logs,references.bib,pixi.lock --ignore-words-list GAGE,FitH,FRO --context 2", description = "Spellcheck with 2 lines of surrounding context for each match" }
zizmor = { cmd = "zizmor .", description = "Audit GitHub Actions workflows for security issues" }

[dependencies]
python = ">=3.14.2,<3.15"
jupyter-book = ">=2.1.1,<3"
codespell = ">=2.4.1,<3"
zizmor = ">=1.29.0,<2"

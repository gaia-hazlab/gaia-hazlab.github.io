<text x="792" y="108" font-size="12.5" font-weight="700" fill="#8a6f2e">PROCESSES</text>
<circle cx="804" cy="130" r="11.5" fill="#B7A57A" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="134" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a2e12">1</text>
<text x="826" y="129" font-size="12.5" font-weight="600" fill="#1c1c1e">Rockfall and serac fall</text>
<text x="826" y="144" font-size="10.5" fill="#5b5b60">upper flanks; Willis Wall serac fall, 28 May 2023</text>
<circle cx="804" cy="170" r="11.5" fill="#B7A57A" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="174" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a2e12">2</text>
<text x="826" y="169" font-size="12.5" font-weight="600" fill="#1c1c1e">Snow and rock avalanche</text>
<text x="826" y="184" font-size="10.5" fill="#5b5b60">Carbon Glacier, 9 Apr 2020; south-west, 10 Dec 2023</text>
<circle cx="804" cy="210" r="11.5" fill="#B7A57A" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="214" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a2e12">3</text>
<text x="826" y="209" font-size="12.5" font-weight="600" fill="#1c1c1e">Glacier stick–slip</text>
<text x="826" y="224" font-size="10.5" fill="#5b5b60">basal icequakes; a seasonal, repeating source</text>
<circle cx="804" cy="250" r="11.5" fill="#B7A57A" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="254" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a2e12">4</text>
<text x="826" y="249" font-size="12.5" font-weight="600" fill="#1c1c1e">Shallow, rain-triggered landslide</text>
<text x="826" y="264" font-size="10.5" fill="#5b5b60">lower slopes, after prolonged wetting</text>
<circle cx="804" cy="290" r="11.5" fill="#B7A57A" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="294" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a2e12">5</text>
<text x="826" y="289" font-size="12.5" font-weight="600" fill="#1c1c1e">Debris flow to lahar</text>
<text x="826" y="304" font-size="10.5" fill="#5b5b60">valley-confined, toward the Orting–Puyallup corridor</text>
<circle cx="804" cy="330" r="11.5" fill="#B7A57A" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="334" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a2e12">6</text>
<text x="826" y="329" font-size="12.5" font-weight="600" fill="#1c1c1e">Volcano-tectonic swarm</text>
<text x="826" y="344" font-size="10.5" fill="#5b5b60">2009 and July 2025 — hydrothermal, not magmatic ascent</text>
<circle cx="804" cy="370" r="11.5" fill="#B7A57A" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="374" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a2e12">7</text>
<text x="826" y="369" font-size="12.5" font-weight="600" fill="#1c1c1e">Tectonic earthquakes</text>
<text x="826" y="384" font-size="10.5" fill="#5b5b60">West Rainier Seismic Zone, offset from the edifice</text>
<circle cx="804" cy="410" r="11.5" fill="#B7A57A" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="414" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a2e12">8</text>
<text x="826" y="409" font-size="12.5" font-weight="600" fill="#1c1c1e">Deep-seated landslide</text>
<text x="826" y="424" font-size="10.5" fill="#5b5b60">suspected; whether it has a seismic signature is open</text>
<text x="792" y="462" font-size="12.5" font-weight="700" fill="#4B2E83">INSTRUMENTS</text>
<circle cx="804" cy="484" r="11.5" fill="#4B2E83" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="488" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">A</text>
<text x="826" y="483" font-size="12.5" font-weight="600" fill="#1c1c1e">Broadband + strong motion</text>
<text x="826" y="498" font-size="10.5" fill="#5b5b60">PNSN, permanent, 2022–</text>
<circle cx="804" cy="524" r="11.5" fill="#4B2E83" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="528" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">B</text>
<text x="826" y="523" font-size="12.5" font-weight="600" fill="#1c1c1e">Temporary nodes</text>
<text x="826" y="538" font-size="10.5" fill="#5b5b60">Jul–Aug 2025, with Rice University</text>
<circle cx="804" cy="564" r="11.5" fill="#4B2E83" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="568" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">C</text>
<text x="826" y="563" font-size="12.5" font-weight="600" fill="#1c1c1e">Distributed acoustic sensing</text>
<text x="826" y="578" font-size="10.5" fill="#5b5b60">existing fibre, a channel every few metres</text>
<circle cx="804" cy="604" r="11.5" fill="#4B2E83" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="608" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">D</text>
<text x="826" y="603" font-size="12.5" font-weight="600" fill="#1c1c1e">Infrasound array</text>
<text x="826" y="618" font-size="10.5" fill="#5b5b60">CVO — hears what the ground misses</text>
<circle cx="804" cy="644" r="11.5" fill="#4B2E83" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="648" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">E</text>
<text x="826" y="643" font-size="12.5" font-weight="600" fill="#1c1c1e">Tiltmeter</text>
<text x="826" y="658" font-size="10.5" fill="#5b5b60">Longmire, streaming since 2025</text>
<circle cx="804" cy="684" r="11.5" fill="#4B2E83" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="688" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">F</text>
<text x="826" y="683" font-size="12.5" font-weight="600" fill="#1c1c1e">GNSS</text>
<text x="826" y="698" font-size="10.5" fill="#5b5b60">continuous deformation</text>
<circle cx="804" cy="724" r="11.5" fill="#4B2E83" stroke="#fcfcfb" stroke-width="2.5"/>
<text x="804" y="728" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">G</text>
<text x="826" y="723" font-size="12.5" font-weight="600" fill="#1c1c1e">SNOTEL + met stations</text>
<text x="826" y="738" font-size="10.5" fill="#5b5b60">snow water equivalent, precipitation, temperature</text>
<text x="24" y="778" font-size="10.5" fill="#5b5b60">GAIA HazLab · Paros Geohazards Center flagship · University of Washington</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">
<defs><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3402a"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77d00"/></marker><marker id="a-stone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6890"/></marker></defs>
<text x="40" y="45" text-anchor="start" font-size="21" fill="#4b2e83" font-weight="700">The definition: .claude/agents/review-&lt;reader&gt;.md</text>
<rect x="40" y="65" width="400" height="70" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="240.0" y="94.6" text-anchor="middle" font-size="18" fill="#2a1a4f" font-weight="700">front matter</text>
<text x="240.0" y="118.0" text-anchor="middle" font-size="18" fill="#2a1a4f">name · description · tools allow-list</text>
<rect x="40" y="150" width="400" height="80" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="240.0" y="173.8" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">who you are  (the reader&#x27;s own file)</text>
<text x="240.0" y="195.9" text-anchor="middle" font-size="17" fill="#2a1a4f">checks in order · weights · vocabulary limits ·</text>
<text x="240.0" y="218.1" text-anchor="middle" font-size="17" fill="#2a1a4f">signature question</text>
<rect x="40" y="245" width="400" height="80" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="240.0" y="268.8" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">how to run  (shared/method.md)</text>
<text x="240.0" y="290.9" text-anchor="middle" font-size="17" fill="#2a1a4f">what to open · a timebox per persona ·</text>
<text x="240.0" y="313.0" text-anchor="middle" font-size="17" fill="#2a1a4f">read no other review</text>
<rect x="40" y="340" width="400" height="95" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="240.0" y="360.3" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">how to judge  (shared/rubric.md)</text>
<text x="240.0" y="382.4" text-anchor="middle" font-size="17" fill="#2a1a4f">eight rubric dimensions · severity:</text>
<text x="240.0" y="404.5" text-anchor="middle" font-size="17" fill="#2a1a4f">blocker / major / minor / polish ·</text>
<text x="240.0" y="426.6" text-anchor="middle" font-size="17" fill="#2a1a4f">evidence rules · exact report format</text>
<rect x="40" y="450" width="400" height="70" rx="8" fill="#fff" stroke="#2a1a4f" stroke-width="2"/>
<text x="240.0" y="468.8" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">hard rules</text>
<text x="240.0" y="490.9" text-anchor="middle" font-size="17" fill="#2a1a4f">cite the live URL · a 404 is a finding ·</text>
<text x="240.0" y="513.0" text-anchor="middle" font-size="17" fill="#2a1a4f">say you are a simulation</text>
<text x="40" y="560" text-anchor="start" font-size="18" fill="#6f6890" font-style="italic">References and rubric are shared files, read at run time,</text>
<text x="40" y="586" text-anchor="start" font-size="18" fill="#6f6890" font-style="italic">so ten readers judge against one standard.</text>
<rect x="500" y="65" width="240" height="60" rx="8" fill="#fff" stroke="#2a1a4f" stroke-width="2"/>
<text x="620.0" y="89.9" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">inputs</text>
<text x="620.0" y="112.0" text-anchor="middle" font-size="17" fill="#2a1a4f">live site URLs · local checkout</text>
<line x1="620" y1="125" x2="620" y2="165" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="500" y="165" width="240" height="62" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="620.0" y="190.9" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">fetch</text>
<text x="620.0" y="213.0" text-anchor="middle" font-size="17" fill="#2a1a4f">one page or repo</text>
<line x1="620" y1="227" x2="620" y2="255" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="500" y="255" width="240" height="62" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="620.0" y="280.9" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">check</text>
<text x="620.0" y="303.0" text-anchor="middle" font-size="17" fill="#2a1a4f">against the persona&#x27;s list</text>
<line x1="620" y1="317" x2="620" y2="345" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="500" y="345" width="240" height="62" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="620.0" y="370.9" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">score</text>
<text x="620.0" y="393.0" text-anchor="middle" font-size="17" fill="#2a1a4f">D1 to D8, weighted</text>
<line x1="620" y1="407" x2="620" y2="435" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="500" y="435" width="240" height="62" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="620.0" y="460.9" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">write</text>
<text x="620.0" y="483.0" text-anchor="middle" font-size="17" fill="#2a1a4f">finding · severity · quote · URL</text>
<path d="M 740 480 Q 800 480 800 338 Q 800 196 740 196" fill="none" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<text x="620" y="530" text-anchor="middle" font-size="17" fill="#6f6890" font-style="italic">repeat until the persona&#x27;s timebox (10 to 45 min) is spent</text>
<path d="M 440 100 Q 470 100 500 196" fill="none" stroke="#6d5bd0" stroke-width="1.8" marker-end="url(#a-stone)"/>
<path d="M 440 190 Q 470 190 500 196" fill="none" stroke="#6d5bd0" stroke-width="1.8" marker-end="url(#a-stone)"/>
<path d="M 440 285 Q 470 285 500 196" fill="none" stroke="#6d5bd0" stroke-width="1.8" marker-end="url(#a-stone)"/>
<path d="M 440 387 Q 470 387 500 196" fill="none" stroke="#6d5bd0" stroke-width="1.8" marker-end="url(#a-stone)"/>
<rect x="870" y="120" width="300" height="300" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="1020.0" y="198.6" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">output: one file</text>
<text x="1020.0" y="220.7" text-anchor="middle" font-size="17" fill="#2a1a4f">review-logs/&lt;date&gt;/&lt;reader&gt;.md</text>
<text x="1020.0" y="242.8" text-anchor="middle" font-size="17" fill="#2a1a4f"></text>
<text x="1020.0" y="264.9" text-anchor="middle" font-size="17" fill="#2a1a4f">one paragraph</text>
<text x="1020.0" y="287.0" text-anchor="middle" font-size="17" fill="#2a1a4f">weighted score / 100</text>
<text x="1020.0" y="309.1" text-anchor="middle" font-size="17" fill="#2a1a4f">findings: severity · dimension</text>
<text x="1020.0" y="331.2" text-anchor="middle" font-size="17" fill="#2a1a4f">what worked · could not judge</text>
<text x="1020.0" y="353.3" text-anchor="middle" font-size="17" fill="#2a1a4f">signature question</text>
<path d="M 740 466 Q 830 466 870 300" fill="none" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<line x1="1020" y1="420" x2="1020" y2="460" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="870" y="460" width="300" height="56" rx="8" fill="#f5f3fb" stroke="#6d5bd0" stroke-width="2"/>
<text x="1020.0" y="493.9" text-anchor="middle" font-size="17" fill="#2a1a4f">synthesis merges ten of these</text>
<text x="1020" y="560" text-anchor="middle" font-size="15" fill="#6f6890">tools: Read · Grep · Glob · Bash ·</text>
<text x="1020" y="582" text-anchor="middle" font-size="15" fill="#6f6890">Write · WebFetch · WebSearch</text>
</svg>

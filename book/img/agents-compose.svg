<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">
<defs><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3402a"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77d00"/></marker><marker id="a-stone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6890"/></marker></defs>
<rect x="40" y="180" width="260" height="200" rx="8" fill="#f5f3fb" stroke="#2a1a4f" stroke-width="2"/>
<text x="170.0" y="255.3" text-anchor="middle" font-size="26" fill="#2a1a4f" font-weight="700">LLM</text>
<text x="170.0" y="289.1" text-anchor="middle" font-size="26" fill="#2a1a4f">predicts the</text>
<text x="170.0" y="322.9" text-anchor="middle" font-size="26" fill="#2a1a4f">next token</text>
<text x="330" y="295" text-anchor="middle" font-size="60" fill="#4b2e83" font-weight="700">+</text>
<rect x="360" y="180" width="260" height="200" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="490.0" y="255.3" text-anchor="middle" font-size="26" fill="#2a1a4f" font-weight="700">tools</text>
<text x="490.0" y="289.1" text-anchor="middle" font-size="26" fill="#2a1a4f">shell · python · git</text>
<text x="490.0" y="322.9" text-anchor="middle" font-size="26" fill="#2a1a4f">files · web</text>
<rect x="20" y="120" width="620" height="320" rx="18" fill="none" stroke="#4b2e83" stroke-width="3" stroke-dasharray="12 8"/>
<text x="330" y="100" text-anchor="middle" font-size="24" fill="#4b2e83" font-weight="700">harness: runs the tool calls, checks permissions</text>
<path d="M 640 150 C 840 150 840 410 640 410" fill="none" stroke="#4b2e83" stroke-width="4" marker-end="url(#a-purple)"/>
<text x="830" y="270" text-anchor="start" font-size="34" fill="#4b2e83" font-weight="700">loop</text>
<text x="830" y="310" text-anchor="start" font-size="20" fill="#2a1a4f">call · run · append the result ·</text>
<text x="830" y="338" text-anchor="start" font-size="20" fill="#2a1a4f">call again, until done</text>
<text x="600" y="520" text-anchor="middle" font-size="30" fill="#4b2e83" font-weight="700">an agent  =  a model, with tools, in a harness, in a loop</text>
</svg>

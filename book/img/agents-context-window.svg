<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">
<defs><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3402a"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77d00"/></marker><marker id="a-stone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6890"/></marker></defs>
<rect x="60" y="110" width="150" height="80" rx="0" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="135.0" y="144.3" text-anchor="middle" font-size="19" fill="#2a1a4f">system</text>
<text x="135.0" y="169.0" text-anchor="middle" font-size="19" fill="#2a1a4f">prompt</text>
<rect x="210" y="110" width="150" height="80" rx="0" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="285.0" y="144.3" text-anchor="middle" font-size="19" fill="#2a1a4f">context</text>
<text x="285.0" y="169.0" text-anchor="middle" font-size="19" fill="#2a1a4f">file</text>
<rect x="360" y="110" width="220" height="80" rx="0" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="470.0" y="144.3" text-anchor="middle" font-size="19" fill="#2a1a4f">tool + skill</text>
<text x="470.0" y="169.0" text-anchor="middle" font-size="19" fill="#2a1a4f">descriptions</text>
<rect x="580" y="110" width="240" height="80" rx="0" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="700.0" y="144.3" text-anchor="middle" font-size="19" fill="#2a1a4f">your prompts ·</text>
<text x="700.0" y="169.0" text-anchor="middle" font-size="19" fill="#2a1a4f">model replies</text>
<rect x="820" y="110" width="320" height="80" rx="0" fill="#c3b8f0" stroke="#4b2e83" stroke-width="2"/>
<text x="980.0" y="156.7" text-anchor="middle" font-size="19" fill="#2a1a4f">tool results</text>
<text x="60" y="90" text-anchor="start" font-size="22" fill="#4b2e83" font-weight="700">One context window, in order</text>
<path d="M 60 200 L 60 212 L 580 212 L 580 200" fill="none" stroke="#6f6890" stroke-width="1.5"/>
<text x="320.0" y="234" text-anchor="middle" font-size="19" fill="#6f6890" font-style="italic">re-sent on every turn: a long AGENTS.md is paid for every call</text>
<path d="M 580 200 L 580 212 L 1140 212 L 1140 200" fill="none" stroke="#6f6890" stroke-width="1.5"/>
<text x="860.0" y="234" text-anchor="middle" font-size="19" fill="#6f6890" font-style="italic">the transcript: summarised when the window fills</text>
<text x="1140" y="290" text-anchor="end" font-size="19" fill="#6f6890" font-style="italic">one cat of a log can be most of it</text>
<rect x="60" y="330" width="260" height="70" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="190.0" y="372.7" text-anchor="middle" font-size="22" fill="#2a1a4f">window full</text>
<line x1="320" y1="365" x2="380" y2="365" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="380" y="330" width="380" height="70" rx="8" fill="#fff7e6" stroke="#c77d00" stroke-width="2"/>
<text x="570.0" y="359.0" text-anchor="middle" font-size="20" fill="#2a1a4f" font-weight="700">summary of the older transcript</text>
<text x="570.0" y="385.0" text-anchor="middle" font-size="20" fill="#2a1a4f">lossy</text>
<line x1="760" y1="365" x2="820" y2="365" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="820" y="330" width="320" height="70" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="980.0" y="372.7" text-anchor="middle" font-size="22" fill="#2a1a4f">continue from the summary</text>
<text x="60" y="450" text-anchor="start" font-size="20" fill="#2a1a4f">A rule stated in the prompt may not survive. A file read early may need re-reading.</text>
<text x="60" y="485" text-anchor="start" font-size="20" fill="#4b2e83" font-weight="700">So: invariants go in the context file, big reads go to a subagent, new task means new session.</text>
</svg>

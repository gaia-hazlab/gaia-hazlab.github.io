<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">
<defs><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3402a"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77d00"/></marker><marker id="a-stone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6890"/></marker></defs>
<line x1="40" y1="230" x2="1170" y2="230" stroke="#6d5bd0" stroke-width="4" marker-end="url(#a-stone)"/>
<circle cx="110" cy="230" r="14" fill="#4b2e83"/>
<text x="110" y="120" text-anchor="middle" font-size="38" fill="#4b2e83" font-weight="700">Nov 2022</text>
<text x="110" y="175" text-anchor="middle" font-size="26" fill="#2a1a4f" font-weight="700">chat</text>
<text x="110" y="275" text-anchor="middle" font-size="19" fill="#6f6890">a text box</text>
<circle cx="340" cy="230" r="14" fill="#4b2e83"/>
<text x="340" y="120" text-anchor="middle" font-size="38" fill="#4b2e83" font-weight="700">Mar 2023</text>
<text x="340" y="175" text-anchor="middle" font-size="26" fill="#2a1a4f" font-weight="700">tools</text>
<text x="340" y="275" text-anchor="middle" font-size="19" fill="#6f6890">it may call functions</text>
<circle cx="570" cy="230" r="14" fill="#4b2e83"/>
<text x="570" y="120" text-anchor="middle" font-size="38" fill="#4b2e83" font-weight="700">Nov 2024</text>
<text x="570" y="175" text-anchor="middle" font-size="26" fill="#2a1a4f" font-weight="700">a standard</text>
<text x="570" y="275" text-anchor="middle" font-size="19" fill="#6f6890">MCP: plug tools in</text>
<circle cx="800" cy="230" r="14" fill="#4b2e83"/>
<text x="800" y="120" text-anchor="middle" font-size="38" fill="#4b2e83" font-weight="700">Feb 2025</text>
<text x="800" y="175" text-anchor="middle" font-size="26" fill="#2a1a4f" font-weight="700">coding agent</text>
<text x="800" y="275" text-anchor="middle" font-size="19" fill="#6f6890">this vendor&#x27;s first</text>
<circle cx="1030" cy="230" r="14" fill="#4b2e83"/>
<text x="1030" y="120" text-anchor="middle" font-size="38" fill="#4b2e83" font-weight="700">2026</text>
<text x="1030" y="175" text-anchor="middle" font-size="26" fill="#2a1a4f" font-weight="700">the window</text>
<text x="1030" y="275" text-anchor="middle" font-size="19" fill="#6f6890">2,048 tokens to 1M</text>
<text x="600" y="345" text-anchor="middle" font-size="24" fill="#2a1a4f" font-weight="700">The window was a big step. What made it usable is the infrastructure around the model:</text>
<text x="600" y="382" text-anchor="middle" font-size="23" fill="#2a1a4f">fewer hallucinations, because retrieval and tool results ground what it says,</text>
<text x="600" y="416" text-anchor="middle" font-size="23" fill="#2a1a4f">and the files that tell it what you want and how to test it.</text>
<text x="600" y="458" text-anchor="middle" font-size="24" fill="#4b2e83" font-weight="700">It moves fast, and geoscience is lagging.</text>
</svg>

<text x="110" y="167" text-anchor="middle" font-size="13" fill="#6f6890" font-style="italic">ChatGPT, Nov 2022 (GPT-3.5)</text>
<circle cx="340" cy="190" r="11" fill="#4b2e83"/>
<text x="340" y="118" text-anchor="middle" font-size="19" fill="#4b2e83" font-weight="700">tools</text>
<text x="340" y="146" text-anchor="middle" font-size="14" fill="#2a1a4f">the model may call functions</text>
<text x="340" y="167" text-anchor="middle" font-size="13" fill="#6f6890" font-style="italic">plugins and GPT-4, Mar 2023</text>
<circle cx="570" cy="190" r="11" fill="#6d5bd0"/>
<text x="570" y="118" text-anchor="middle" font-size="19" fill="#4b2e83" font-weight="700">trained for tool use</text>
<text x="570" y="146" text-anchor="middle" font-size="14" fill="#2a1a4f">plan, call tools, read results,</text>
<text x="570" y="167" text-anchor="middle" font-size="13" fill="#6f6890" font-style="italic">debug (date: TODO)</text>
<circle cx="800" cy="190" r="11" fill="#6d5bd0"/>
<text x="800" y="118" text-anchor="middle" font-size="19" fill="#4b2e83" font-weight="700">harnesses</text>
<text x="800" y="146" text-anchor="middle" font-size="14" fill="#2a1a4f">terminal · editor · app · browser</text>
<text x="800" y="167" text-anchor="middle" font-size="13" fill="#6f6890" font-style="italic">one engine (date: TODO)</text>
<circle cx="1030" cy="190" r="11" fill="#6d5bd0"/>
<text x="1030" y="118" text-anchor="middle" font-size="19" fill="#4b2e83" font-weight="700">a standard for tools</text>
<text x="1030" y="146" text-anchor="middle" font-size="14" fill="#2a1a4f">MCP: open standard connecting</text>
<text x="1030" y="167" text-anchor="middle" font-size="13" fill="#6f6890" font-style="italic">AI apps to external systems</text>
<text x="600" y="260" text-anchor="middle" font-size="17" fill="#2a1a4f">What changed for research: tool results are grounded facts the model must read, retrieval finds real papers,</text>
<text x="600" y="288" text-anchor="middle" font-size="17" fill="#2a1a4f">and a harness runs the loop against your own repository. Denolle (June 2026): literature review is close to solved.</text>
<text x="600" y="340" text-anchor="middle" font-size="14" fill="#6f6890" font-style="italic">Filled dots: dates from a fetched source. Hollow-coloured dots: ordered stages, dates still to verify.</text>

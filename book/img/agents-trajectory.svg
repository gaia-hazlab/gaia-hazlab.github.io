<text x="40" y="200" text-anchor="start" font-size="20" fill="#4b2e83" font-weight="700">Guardrails on the run</text>
<text x="40" y="235" text-anchor="start" font-size="18" fill="#2a1a4f">• human approves anything outward-facing</text>
<text x="40" y="265" text-anchor="start" font-size="18" fill="#2a1a4f">• no fabricated DOIs; provenance must be real</text>
<text x="40" y="295" text-anchor="start" font-size="18" fill="#2a1a4f">• secrets never in the repository</text>
<text x="40" y="325" text-anchor="start" font-size="18" fill="#2a1a4f">• bounded: turns · cost · wall clock</text>
<text x="40" y="355" text-anchor="start" font-size="18" fill="#2a1a4f">• smallest change that resolves the issue</text>
<text x="610" y="310" text-anchor="start" font-size="18" fill="#6f6890" font-style="italic">HazEvalHub already scores the three scorecard questions.</text>
<text x="610" y="342" text-anchor="start" font-size="18" fill="#4b2e83" font-weight="700">The gap: the trajectory is not yet in the provenance record.</text>

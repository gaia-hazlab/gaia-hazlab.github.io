<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">
<defs><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3402a"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77d00"/></marker><marker id="a-stone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6890"/></marker></defs>
<rect x="40" y="60" width="250" height="90" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="165.0" y="87.0" text-anchor="middle" font-size="19" fill="#2a1a4f" font-weight="700">request</text>
<text x="165.0" y="111.7" text-anchor="middle" font-size="19" fill="#2a1a4f">&quot;add a funding</text>
<text x="165.0" y="136.3" text-anchor="middle" font-size="19" fill="#2a1a4f">acknowledgement&quot;</text>
<line x1="290" y1="105" x2="340" y2="105" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="340" y="60" width="250" height="90" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="465.0" y="99.3" text-anchor="middle" font-size="19" fill="#2a1a4f">harness matches the</text>
<text x="465.0" y="124.0" text-anchor="middle" font-size="19" fill="#2a1a4f">skill description</text>
<line x1="590" y1="105" x2="640" y2="105" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="640" y="60" width="250" height="90" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="765.0" y="99.3" text-anchor="middle" font-size="19" fill="#2a1a4f">loads SKILL.md body</text>
<text x="765.0" y="124.0" text-anchor="middle" font-size="19" fill="#2a1a4f">three instructions</text>
<line x1="890" y1="105" x2="940" y2="105" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="940" y="60" width="230" height="90" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="1055.0" y="99.3" text-anchor="middle" font-size="19" fill="#2a1a4f">reads the wording</text>
<text x="1055.0" y="124.0" text-anchor="middle" font-size="19" fill="#2a1a4f">from how-we-work.md</text>
<path d="M 1055 150 L 1055 200 L 765 200 L 765 230" fill="none" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="640" y="230" width="250" height="80" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="765.0" y="264.3" text-anchor="middle" font-size="19" fill="#2a1a4f">inserts it verbatim</text>
<text x="765.0" y="289.0" text-anchor="middle" font-size="19" fill="#2a1a4f">three award numbers</text>
<line x1="640" y1="270" x2="590" y2="270" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="340" y="230" width="250" height="80" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="465.0" y="264.9" text-anchor="middle" font-size="17" fill="#2a1a4f" font-weight="700">verify</text>
<text x="465.0" y="287.0" text-anchor="middle" font-size="17" fill="#2a1a4f">string match against the page</text>
<path d="M 465 150 L 465 200 L 165 200 L 165 230" fill="none" stroke="#c77d00" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a-amber)"/>
<rect x="40" y="230" width="250" height="80" rx="8" fill="#fff7e6" stroke="#c77d00" stroke-width="2"/>
<text x="165.0" y="264.3" text-anchor="middle" font-size="19" fill="#2a1a4f">no match → paraphrase</text>
<text x="165.0" y="289.0" text-anchor="middle" font-size="19" fill="#2a1a4f">fix the description</text>
<text x="40" y="360" text-anchor="start" font-size="19" fill="#6f6890" font-style="italic">Invoked by name, the match step is skipped. Unprompted, the description is the whole test.</text>

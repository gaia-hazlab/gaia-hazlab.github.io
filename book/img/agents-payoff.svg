<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22">
<defs><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b3402a"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c77d00"/></marker><marker id="a-stone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6890"/></marker></defs>
<rect x="30" y="80" width="210" height="120" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="135.0" y="124.8" text-anchor="middle" font-size="16" fill="#2a1a4f" font-weight="700">1. write the spec</text>
<text x="135.0" y="145.6" text-anchor="middle" font-size="16" fill="#2a1a4f">what, inputs, outputs,</text>
<text x="135.0" y="166.4" text-anchor="middle" font-size="16" fill="#2a1a4f">what done looks like</text>
<line x1="240" y1="140" x2="265" y2="140" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="265" y="80" width="210" height="120" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="370.0" y="124.8" text-anchor="middle" font-size="16" fill="#2a1a4f" font-weight="700">2. intent, not syntax</text>
<text x="370.0" y="145.6" text-anchor="middle" font-size="16" fill="#2a1a4f">&quot;implement the spec;</text>
<text x="370.0" y="166.4" text-anchor="middle" font-size="16" fill="#2a1a4f">stop at the first test&quot;</text>
<line x1="475" y1="140" x2="500" y2="140" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="500" y="80" width="210" height="120" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="605.0" y="124.8" text-anchor="middle" font-size="16" fill="#2a1a4f" font-weight="700">3. repo template</text>
<text x="605.0" y="145.6" text-anchor="middle" font-size="16" fill="#2a1a4f">pyproject · tests · CI · docs</text>
<text x="605.0" y="166.4" text-anchor="middle" font-size="16" fill="#2a1a4f">using X or best standards</text>
<line x1="710" y1="140" x2="735" y2="140" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="735" y="80" width="210" height="120" rx="8" fill="#fff" stroke="#4b2e83" stroke-width="2"/>
<text x="840.0" y="124.8" text-anchor="middle" font-size="16" fill="#2a1a4f" font-weight="700">4. CI tests for X</text>
<text x="840.0" y="145.6" text-anchor="middle" font-size="16" fill="#2a1a4f">&quot;write every test</text>
<text x="840.0" y="166.4" text-anchor="middle" font-size="16" fill="#2a1a4f">for module X; run them&quot;</text>
<line x1="945" y1="140" x2="970" y2="140" stroke="#4b2e83" stroke-width="2.5" marker-end="url(#a-purple)"/>
<rect x="970" y="80" width="210" height="120" rx="8" fill="#f5f3fb" stroke="#4b2e83" stroke-width="2"/>
<text x="1075.0" y="124.8" text-anchor="middle" font-size="16" fill="#2a1a4f" font-weight="700">5. show me the raw data</text>
<text x="1075.0" y="145.6" text-anchor="middle" font-size="16" fill="#2a1a4f">plot the waveforms and</text>
<text x="1075.0" y="166.4" text-anchor="middle" font-size="16" fill="#2a1a4f">the intermediate arrays</text>
<text x="135" y="245" text-anchor="middle" font-size="18" fill="#4b2e83" font-weight="700">you</text>
<text x="605" y="245" text-anchor="middle" font-size="18" fill="#4b2e83" font-weight="700">the agent, against your spec</text>
<text x="1075" y="245" text-anchor="middle" font-size="18" fill="#4b2e83" font-weight="700">you, by eye</text>
<path d="M 265 215 L 265 227 L 945 227 L 945 215" fill="none" stroke="#6f6890" stroke-width="1.5"/>
<text x="605.0" y="249" text-anchor="middle" font-size="19" fill="#6f6890" font-style="italic"></text>
<text x="600" y="320" text-anchor="middle" font-size="17" fill="#2a1a4f">The spec is the contract and the test is the verify step. Step 5 is how you check the agent without</text>
<text x="600" y="348" text-anchor="middle" font-size="17" fill="#2a1a4f">reading every line it wrote: if the raw data look wrong, the pipeline is wrong.</text>
<text x="600" y="405" text-anchor="middle" font-size="15" fill="#6f6890" font-style="italic">Agent errors are specification and judgement errors; a good spec removes the first kind.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b2e83"/>
    </marker>
  </defs>

  <!-- Panel A: chat session -->
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#333">A. Chat session</text>
  <rect x="20" y="60" width="120" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="87" text-anchor="middle">human prompt</text>
  <line x1="140" y1="82" x2="190" y2="82" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="60" width="90" height="44" rx="6" fill="#f3f0f9" stroke="#333" stroke-width="1.5"/>
  <text x="235" y="87" text-anchor="middle">answer</text>

  <rect x="20" y="130" width="120" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="157" text-anchor="middle">human prompt</text>
  <line x1="140" y1="152" x2="190" y2="152" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="130" width="90" height="44" rx="6" fill="#f3f0f9" stroke="#333" stroke-width="1.5"/>
  <text x="235" y="157" text-anchor="middle">answer</text>

  <rect x="20" y="200" width="120" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="80" y="227" text-anchor="middle">human prompt</text>
  <line x1="140" y1="222" x2="190" y2="222" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="190" y="200" width="90" height="44" rx="6" fill="#f3f0f9" stroke="#333" stroke-width="1.5"/>
  <text x="235" y="227" text-anchor="middle">answer</text>

  <text x="20" y="290" font-size="12" fill="#555">The human closes every loop.</text>
  <text x="20" y="308" font-size="12" fill="#555">The model never touches the</text>
  <text x="20" y="326" font-size="12" fill="#555">filesystem, the shell, or the web.</text>

  <!-- Panel B: fixed workflow script -->
  <text x="340" y="30" font-size="16" font-weight="bold" fill="#333">B. Fixed workflow script</text>
  <rect x="340" y="60" width="110" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="395" y="87" text-anchor="middle">step 1</text>
  <line x1="395" y1="104" x2="395" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="340" y="130" width="110" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="395" y="157" text-anchor="middle">step 2</text>
  <line x1="395" y1="174" x2="395" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="340" y="200" width="110" height="44" rx="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="395" y="227" text-anchor="middle">step 3</text>

  <text x="340" y="290" font-size="12" fill="#555">Deterministic. Every branch was</text>
  <text x="340" y="308" font-size="12" fill="#555">written in advance. An unexpected</text>
  <text x="340" y="326" font-size="12" fill="#555">state is a crash, not a decision.</text>

  <!-- Panel C: agent loop -->
  <text x="560" y="30" font-size="16" font-weight="bold" fill="#4b2e83">C. Agent loop</text>

  <rect x="600" y="60" width="140" height="44" rx="6" fill="#f3f0f9" stroke="#4b2e83" stroke-width="2"/>
  <text x="670" y="87" text-anchor="middle" fill="#4b2e83">gather context</text>

  <rect x="800" y="140" width="120" height="44" rx="6" fill="#f3f0f9" stroke="#4b2e83" stroke-width="2"/>
  <text x="860" y="167" text-anchor="middle" fill="#4b2e83">act (tool call)</text>

  <rect x="600" y="220" width="140" height="44" rx="6" fill="#f3f0f9" stroke="#4b2e83" stroke-width="2"/>
  <text x="670" y="247" text-anchor="middle" fill="#4b2e83">verify</text>

  <rect x="470" y="140" width="110" height="44" rx="6" fill="#fff" stroke="#4b2e83" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="525" y="160" text-anchor="middle" fill="#4b2e83" font-size="12">done? stop.</text>
  <text x="525" y="176" text-anchor="middle" fill="#4b2e83" font-size="12">else repeat</text>

  <!-- arrows around the loop -->
  <path d="M 740 82 Q 860 82 860 140" fill="none" stroke="#4b2e83" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M 860 184 Q 860 242 740 242" fill="none" stroke="#4b2e83" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M 600 242 Q 525 242 525 184" fill="none" stroke="#4b2e83" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M 525 140 Q 525 82 600 82" fill="none" stroke="#4b2e83" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- the human: always at the start; optionally at the gate before each act -->
  <rect x="455" y="90" width="140" height="44" rx="6" fill="#fff7e6" stroke="#c77d00" stroke-width="2"/>
  <text x="525" y="108" text-anchor="middle" font-size="13" fill="#c77d00" font-weight="700">you</text>
  <text x="525" y="126" text-anchor="middle" font-size="12" fill="#c77d00">goal · rules · stop</text>
  <path d="M 595 100 Q 598 90 600 86" fill="none" stroke="#c77d00" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="786" y="108" width="160" height="24" rx="4" fill="#fff7e6" stroke="#c77d00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="866" y="125" text-anchor="middle" font-size="12" fill="#c77d00">gate: you, if you choose</text>

  <text x="560" y="300" font-size="12" fill="#555">The model decides the next step from what it just observed.</text>
  <text x="560" y="318" font-size="12" fill="#555">Every tool result re-enters the context window.</text>
  <text x="560" y="336" font-size="12" fill="#555">You always enter at the start. Where else you enter, on every</text>
  <text x="560" y="354" font-size="12" fill="#555">action, on every diff, only at the end, or nowhere, is the hardest</text>
  <text x="560" y="372" font-size="12" fill="#555">design question, and the answer keeps moving toward less.</text>
</svg>
